name: Deploy live demo to GitHub Pages

# Publishes docs/index.html (the in-browser demo) to
# https://maxmilliamokafor.github.io/signaldesk/
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". This workflow then deploys on every push.
# (configure-pages with enablement:true attempts to turn this on automatically.)

on:
  push:
    branches: [main, "claude/nifty-hawking-j3434e"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
