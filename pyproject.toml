[project]
name = "signaldesk"
version = "0.1.0"
description = "Real-time market-sentiment engine with citation-validated LLM extraction."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008", "UP017"]  # FastAPI defaults; keep timezone.utc for 3.10 compat

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
